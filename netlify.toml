[build]
  command = "echo \"VITE_SUPABASE_URL=https://lvnmrrpsrixvmbgxqvoj.supabase.co\" > .env && echo \"VITE_SUPABASE_PUBLISHABLE_KEY=$lvnmrrpsrixvmbgxqvoj\" >> .env && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
